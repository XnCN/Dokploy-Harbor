name: Validate Harbor package
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Run Docker integration on an isolated GitHub runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node tools/check.mjs
      - run: python3 -m unittest discover -s tests -v
      - run: sh tools/test.sh
      - name: Validate Compose interpolation with backup disabled
        env:
          HARBOR_INSTANCE_ID: harbor-ci-validation
          HARBOR_HOSTNAME: registry.company.test
          HARBOR_ADMIN_PASSWORD: ci-admin-password-not-for-production
          HARBOR_DB_PASSWORD: ci-database-password-not-for-production
          BACKUP_ENABLED: 'false'
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.restore.yaml config --quiet
  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check.mjs
      - run: sh tools/integration.sh
        env:
          HARBOR_RUN_INTEGRATION: '1'
